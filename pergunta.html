<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aniversário da Hilary🎂</title>
    <link rel="stylesheet" href="pergunta.css" />
  </head>
  <body>
    <div class="bg-hearts" id="bg-hearts" aria-hidden="true"></div>

    <main class="question-shell">
      <section class="question-card">
        <span class="badge-heart" aria-hidden="true"></span>
        <p class="eyebrow">Só mais uma coisinha antes do presente</p>
        <h1 id="main-question">Você se jogaria de um prédio por mim?</h1>

        <div class="button-stack" id="button-stack">
          <button id="btn-sim" class="btn-sim" type="button">
            <span class="btn-label">Sim</span>
          </button>
          <button id="btn-nao" class="btn-nao" type="button" style="--scale: 1">
            <span class="btn-label">Não</span>
          </button>
        </div>

        <p class="warning-text" id="warning-text" hidden></p>

        <div class="reveal" id="reveal" hidden>
          <p class="reveal-text">
            aww, eu sabia que você me ama muito e me salvaria kkkkk ❤️
          </p>
          <a href="cartao.html" class="open-card-btn">Abrir cartão de aniversário 🎁</a>
        </div>
      </section>
    </main>

    <script src="pergunta.js"></script>
  </body>
</html>
